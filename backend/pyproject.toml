[project]
name = "blindport"
version = "0.2.3"
description = "Blindport backend: dedicated IP, reserved TCP/UDP port, and SNI-routed relay subscriptions."
authors = [{ name = "Blindport", email = "support@blindport.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "segno>=1.6.1",
    "cryptography>=43.0.0",
    "dnspython>=2.7.0",
    "psycopg[binary]>=3.2.0",
    "webauthn>=3.0.0,<4.0.0",
]

[project.urls]
Homepage = "https://blindport.com"
Source = "https://github.com/blindport/blindport"
Documentation = "https://github.com/blindport/blindport#readme"
Issues = "https://github.com/blindport/blindport/issues"
Changelog = "https://github.com/blindport/blindport/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pip-tools>=7.4.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "playwright>=1.59.0",
    "types-requests",
    "httpx>=0.27.0",
]

[project.scripts]
blindport-migrate = "blindport.migrations.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blindport = [
    "migrations/script.py.mako",
    "templates/*.html",
    "static/*.css",
    "static/*.ico",
    "static/*.js",
    "static/*.png",
    "static/*.svg",
    "static/*.webmanifest",
    "public/*.asc",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
# B008: FastAPI uses Depends/Header/Query as argument defaults by design.
# UP007: keep Optional[...] style for compatibility with pydantic v1 docs.
ignore = ["E501", "B008", "UP007"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
