name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
        with:
          args: --config .gitleaks.toml git --redact --verbose .

  nwc-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Install locked dependencies
        working-directory: tools/nwc-helper
        run: bun install --frozen-lockfile
      - name: Test, typecheck, lint, and build
        working-directory: tools/nwc-helper
        run: bun test && bun run typecheck && bun run lint && bun run build

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements-dev.txt
          pip install --no-deps ./backend
      - name: Check dependency locks
        if: matrix.python-version == '3.14'
        run: |
          cp backend/requirements.txt /tmp/requirements.txt
          cp backend/requirements-dev.txt /tmp/requirements-dev.txt
          pip-compile --generate-hashes --strip-extras --allow-unsafe --no-header \
            --output-file /tmp/requirements.txt backend/pyproject.toml
          pip-compile --generate-hashes --strip-extras --allow-unsafe --no-header \
            --extra dev --output-file /tmp/requirements-dev.txt backend/pyproject.toml
          diff -u backend/requirements.txt /tmp/requirements.txt
          diff -u backend/requirements-dev.txt /tmp/requirements-dev.txt
      - name: Ruff
        run: ruff check backend
      - name: Pytest
        run: pytest backend/tests -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_DB: blindport
          POSTGRES_USER: blindport
          POSTGRES_PASSWORD: blindport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blindport -d blindport"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://blindport:blindport@localhost:5432/blindport
      DATABASE_MIGRATE_ON_STARTUP: "false"
      TEST_POSTGRES_DATABASE_URL: postgresql+psycopg://blindport:blindport@localhost:5432/blindport
      SECRET_KEY: postgres-ci-secret
      ADMIN_TOKEN: POSTGRESCIADMIN0000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements-dev.txt
          pip install --no-deps ./backend
      - name: Upgrade and verify migrations
        run: |
          blindport-migrate upgrade
          blindport-migrate current --check
      - name: Start application without startup migration
        run: |
          python -c "from fastapi.testclient import TestClient; from blindport.main import app; c = TestClient(app); c.__enter__(); assert c.get('/api/v1/health').status_code == 200; c.__exit__(None, None, None)"
      - name: PostgreSQL lifecycle test
        run: pytest backend/tests/test_postgres.py -q

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test with race detector
        run: go test -race ./...

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate deployment configuration
        run: ./deploy/validate.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements-dev.txt
          pip install --no-deps ./backend
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser regressions
        env:
          BROWSER_ARTIFACT_DIR: tmp/browser-artifacts
        run: pytest tests/browser -q
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failure-artifacts
          path: tmp/browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [secrets, nwc-helper, backend, postgres, go, deployment, browser]
    env:
      COMPOSE_FILE: docker/docker-compose.yaml:.github/e2e-ci.override.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Run e2e tests
        run: |
          docker compose exec -T tester \
            pytest -p no:cacheprovider /repo/tests/e2e -v
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
