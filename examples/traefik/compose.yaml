name: blindport-traefik-demo

services:
  site:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    volumes:
      - ./site/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - ingress
    labels:
      traefik.enable: "true"
      traefik.docker.network: blindport-demo-ingress
      traefik.http.routers.site.rule: "Host(`${DOMAIN:?set DOMAIN in .env}`)"
      traefik.http.routers.site.entrypoints: websecure
      traefik.http.routers.site.tls: "true"
      traefik.http.routers.site.tls.certresolver: letsencrypt
      traefik.http.services.site.loadbalancer.server.port: "80"
      tech.blindport.mapping.site.subscription: "${BLINDPORT_SUBSCRIPTION_ID:?set BLINDPORT_SUBSCRIPTION_ID in .env}"
      tech.blindport.mapping.site.upstream: traefik:443
      tech.blindport.mapping.site.http_challenge_upstream: traefik:80
  traefik:
    image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    restart: unless-stopped
    depends_on:
      blindportd:
        condition: service_started
    entrypoint: ["/bin/sh", "-c", "sleep 30; exec /entrypoint.sh \"$$@\"", "--"]
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=blindport-demo-ingress
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    environment:
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: "${ACME_EMAIL:-}"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - ingress

  blindportd:
    image: ${BLINDPORTD_IMAGE:-ghcr.io/blindport/blindportd:latest}
    init: true
    restart: unless-stopped
    depends_on:
      site:
        condition: service_started
    command: ["--docker"]
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      BLINDPORT_BACKEND_URL: "${BLINDPORT_BACKEND_URL:-https://blindport.com}"
      BLINDPORT_DOCKER_POLL_INTERVAL: 1s
      BLINDPORT_TOKEN: "${BLINDPORT_TOKEN:?set BLINDPORT_TOKEN in .env}"
      BLINDPORT_STATE_DIR: /var/lib/blindport
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - blindport-state:/var/lib/blindport
    networks:
      - ingress

volumes:
  letsencrypt:
  blindport-state:

networks:
  ingress:
    name: blindport-demo-ingress
