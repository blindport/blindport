name: blindport-relay

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: journald
    options:
      tag: "blindport-relay-{{.Name}}"

services:
  relay:
    <<: *service-defaults
    image: ${RELAY_IMAGE}
    network_mode: host
    environment:
      BLINDPORT_BACKEND_URL: ${BACKEND_INTERNAL_URL}
      BLINDPORT_RELAY_SECRET_FILE: /run/secrets/relay-secret
      BLINDPORT_RELAY_IPS: ${RELAY_FRAMED_IPS:-}
      BLINDPORT_RELAY_PORTS: ${RELAY_FRAMED_PORTS:-443}
      BLINDPORT_RELAY_SHARED_IPS: ${RELAY_SHARED_LISTEN_IPS:-${RELAY_PUBLIC_IP}}
      BLINDPORT_RELAY_SHARED_TCP_PORTS: ${PORT_TCP_RANGE}
      BLINDPORT_RELAY_SHARED_UDP_PORTS: ${PORT_UDP_RANGE}
      BLINDPORT_RELAY_MAX_PORT_LISTENERS: ${PORT_MAX_ACTIVE_LISTENERS:-8192}
      BLINDPORT_RELAY_SNI: ${RELAY_SNI_LISTENERS:-${RELAY_PUBLIC_IP}:443}
      BLINDPORT_RELAY_HTTP_CHALLENGE: ${RELAY_HTTP_CHALLENGE_LISTENERS:-${RELAY_PUBLIC_IP}:80}
      BLINDPORT_RELAY_MTLS_HOSTS: ${RELAY_CONTROL_HOST}
      BLINDPORT_RELAY_CERTIFICATE_CACHE_DIR: /var/lib/blindport
      BLINDPORT_RELAY_HEARTBEAT_INTERVAL: ${RELAY_HEARTBEAT_INTERVAL:-30s}
      BLINDPORT_RELAY_HEARTBEAT_TOKEN_FILE: ${RELAY_HEARTBEAT_TOKEN_FILE:-}
      BLINDPORT_RELAY_BANDWIDTH_METRICS: ${RELAY_BANDWIDTH_METRICS_ENABLED:-false}
      BLINDPORT_RELAY_BANDWIDTH_INTERVAL: ${RELAY_BANDWIDTH_INTERVAL:-1m}
      BLINDPORT_RELAY_BANDWIDTH_STATE_FILE: /var/lib/blindport/bandwidth.json
      BLINDPORT_RELAY_ADMIN: 127.0.0.1:9090
      BLINDPORT_RELAY_MAX_CONTROL_HANDSHAKES: ${RELAY_MAX_CONTROL_HANDSHAKES:-256}
      BLINDPORT_RELAY_MAX_INGRESS: ${RELAY_MAX_INGRESS:-4096}
      BLINDPORT_RELAY_MAX_SNI_PEEKS: ${RELAY_MAX_SNI_PEEKS:-512}
      BLINDPORT_RELAY_MAX_HTTP_CHALLENGES: ${RELAY_MAX_HTTP_CHALLENGES:-64}
      BLINDPORT_RELAY_HTTP_CHALLENGE_RATE: ${RELAY_HTTP_CHALLENGE_RATE:-600}
      BLINDPORT_RELAY_HTTP_CHALLENGE_BURST: ${RELAY_HTTP_CHALLENGE_BURST:-100}
      BLINDPORT_RELAY_MAX_CONTROL_PER_SOURCE: ${RELAY_MAX_CONTROL_PER_SOURCE:-8}
      BLINDPORT_RELAY_MAX_INGRESS_PER_SOURCE: ${RELAY_MAX_INGRESS_PER_SOURCE:-128}
      BLINDPORT_RELAY_MAX_STREAMS_PER_TUNNEL: ${RELAY_MAX_STREAMS_PER_TUNNEL:-256}
      BLINDPORT_RELAY_SHUTDOWN_TIMEOUT: 25s
      BLINDPORT_RELAY_WIREGUARD: "0"
      OFFLINE_ENTITLEMENTS_ENABLED: ${OFFLINE_ENTITLEMENTS_ENABLED:-false}
      OFFLINE_ENTITLEMENT_PUBLIC_KEYS: ${OFFLINE_ENTITLEMENT_PUBLIC_KEYS:-}
      OFFLINE_ENTITLEMENT_MAX_GRACE_SECONDS: ${OFFLINE_ENTITLEMENT_MAX_GRACE_SECONDS:-604800}
      RELAY_EDGE_ID: ${RELAY_EDGE_ID:-}
    secrets:
      - source: relay-secret
        target: relay-secret
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: relay-heartbeat-token
        target: relay-heartbeat-token
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - relay-state:/var/lib/blindport
    command: ["-control", "${RELAY_PUBLIC_IP}:5443", "-control-listeners", "${RELAY_CONTROL_LISTENERS:-}"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    pids_limit: 500
    mem_limit: ${RELAY_MEMORY_LIMIT:-1g}
    cpus: ${RELAY_CPU_LIMIT:-4.0}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  health-proxy:
    <<: *service-defaults
    image: haproxy:3.2.1-alpine@sha256:ac79fe145f2bb6626ff26b584a2d0a34e791906c01015f2ae037aa3137b683d9
    user: "99:99"
    network_mode: host
    environment:
      RELAY_PUBLIC_IP: ${RELAY_PUBLIC_IP}
    volumes:
      - ./health-proxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /var/lib/haproxy:size=4m,mode=0750,uid=99,gid=99
    pids_limit: 50
    mem_limit: 32m
    cpus: 0.25
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  relay-secret:
    file: ${SECRETS_DIR:-./secrets}/relay-secret
  relay-heartbeat-token:
    file: ${SECRETS_DIR:-./secrets}/relay-heartbeat-token

volumes:
  relay-state:
