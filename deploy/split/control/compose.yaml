name: blindport-control

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: journald
    options:
      tag: "blindport-control-{{.Name}}"

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  DEBUG: "false"
  DATABASE_MIGRATE_ON_STARTUP: "false"
  DATABASE_URL_FILE: /run/secrets/database-url
  SECRET_KEY_FILE: /run/secrets/secret-key
  TOKEN_HASH_KEY_FILE: /run/secrets/token-hash-key
  RELAY_SECRET_FILE: /run/secrets/relay-secret
  RELAY_HEARTBEAT_KEYS_FILE: ${RELAY_HEARTBEAT_KEYS_FILE:-}
  ADMIN_TOKEN_FILE: /run/secrets/admin-token
  LND_INVOICE_HMAC_KEY_FILE: /run/secrets/lnd-invoice-hmac-key
  CREDENTIAL_ENCRYPTION_KEY_FILE: ${CREDENTIAL_ENCRYPTION_KEY_FILE:-}
  CLINK_NOSTR_PRIVATE_KEY_FILE: ${CLINK_NOSTR_PRIVATE_KEY_FILE:-}
  SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
  OFFLINE_ENTITLEMENTS_ENABLED: ${OFFLINE_ENTITLEMENTS_ENABLED:-false}
  OFFLINE_ENTITLEMENT_GRACE_SECONDS: ${OFFLINE_ENTITLEMENT_GRACE_SECONDS:-604800}
  OFFLINE_ENTITLEMENT_KEY_ID: ${OFFLINE_ENTITLEMENT_KEY_ID:-}
  OFFLINE_ENTITLEMENT_PRIVATE_KEY_FILE: ${OFFLINE_ENTITLEMENT_PRIVATE_KEY_FILE:-}
  CA_DIR: /var/lib/blindport/ca
  LEGACY_CLIENT_CERT_ISSUANCE_ENABLED: "false"
  PAYMENT_ENABLED_METHODS: ${PAYMENT_ENABLED_METHODS:-lightning}
  STABLECOIN_PAYMENTS_ENABLED: ${STABLECOIN_PAYMENTS_ENABLED:-false}
  STABLECOIN_SWAP_MARKUP_BPS: ${STABLECOIN_SWAP_MARKUP_BPS:-1000}
  STABLECOIN_SWAP_INVOICE_EXPIRY_SECONDS: ${STABLECOIN_SWAP_INVOICE_EXPIRY_SECONDS:-1200}
  STABLECOIN_SWAP_DEFAULT_ASSET: ${STABLECOIN_SWAP_DEFAULT_ASSET:-USDC-BASE}
  STABLECOIN_SWAP_MIN_INVOICE_SATS: ${STABLECOIN_SWAP_MIN_INVOICE_SATS:-5000}
  STABLECOIN_CHECKOUT_PROVIDER: ${STABLECOIN_CHECKOUT_PROVIDER:-lightning_swap}
  BOLTZ_WEB_URL: ${BOLTZ_WEB_URL:-https://boltz.exchange}
  LIGHTNING_SWAP_WEB_URL: ${LIGHTNING_SWAP_WEB_URL:-https://lightning-swap.com}
  LIGHTNING_SWAP_DEFAULT_ASSET: ${LIGHTNING_SWAP_DEFAULT_ASSET:-USDCSOL}
  BTC_USD_PRICE_ENABLED: ${BTC_USD_PRICE_ENABLED:-true}
  BTC_USD_PRICE_REFRESH_SECONDS: ${BTC_USD_PRICE_REFRESH_SECONDS:-300}
  BTC_USD_PRICE_MAX_STALE_SECONDS: ${BTC_USD_PRICE_MAX_STALE_SECONDS:-1800}
  PAYMENT_LIGHTNING_ADAPTER: lnd
  PAYMENT_NWC_ADAPTER: ${PAYMENT_NWC_ADAPTER:-mock}
  NWC_ALLOWED_RELAY_HOSTS: ${NWC_ALLOWED_RELAY_HOSTS:-}
  NWC_ALLOW_PUBLIC_RELAYS: ${NWC_ALLOW_PUBLIC_RELAYS:-false}
  NWC_ALLOW_LEGACY_NIP04: ${NWC_ALLOW_LEGACY_NIP04:-false}
  PAYMENT_CLINK_ADAPTER: ${PAYMENT_CLINK_ADAPTER:-mock}
  CLINK_ALLOWED_RELAY_HOSTS: ${CLINK_ALLOWED_RELAY_HOSTS:-}
  CLINK_ALLOW_PUBLIC_RELAYS: ${CLINK_ALLOW_PUBLIC_RELAYS:-false}
  # Automatic wallets stay disabled until their migrations and secrets are installed.
  REMINDER_EMAIL_ENABLED: ${REMINDER_EMAIL_ENABLED:-false}
  ANNOUNCEMENT_EMAIL_ENABLED: ${ANNOUNCEMENT_EMAIL_ENABLED:-false}
  NOTIFICATION_RECONCILIATION_ENABLED: ${NOTIFICATION_RECONCILIATION_ENABLED:-true}
  NOTIFICATION_RECONCILIATION_INTERVAL_SECONDS: ${NOTIFICATION_RECONCILIATION_INTERVAL_SECONDS:-10}
  NOTIFICATION_RECONCILIATION_BATCH_SIZE: ${NOTIFICATION_RECONCILIATION_BATCH_SIZE:-100}
  NOTIFICATION_RECONCILIATION_STARTUP_GRACE_SECONDS: ${NOTIFICATION_RECONCILIATION_STARTUP_GRACE_SECONDS:-30}
  NOTIFICATION_RECONCILIATION_STALE_AFTER_SECONDS: ${NOTIFICATION_RECONCILIATION_STALE_AFTER_SECONDS:-60}
  NOTIFICATION_DELIVERY_LEASE_SECONDS: ${NOTIFICATION_DELIVERY_LEASE_SECONDS:-45}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
  PAYMENT_RECONCILIATION_ENABLED: "true"
  PAYMENT_RECONCILIATION_INTERVAL_SECONDS: ${PAYMENT_RECONCILIATION_INTERVAL_SECONDS:-10}
  PAYMENT_RECONCILIATION_BATCH_SIZE: ${PAYMENT_RECONCILIATION_BATCH_SIZE:-100}
  PAYMENT_RECONCILIATION_STARTUP_GRACE_SECONDS: ${PAYMENT_RECONCILIATION_STARTUP_GRACE_SECONDS:-30}
  PAYMENT_RECONCILIATION_STALE_AFTER_SECONDS: ${PAYMENT_RECONCILIATION_STALE_AFTER_SECONDS:-60}
  LND_REST_URL: ${LND_REST_URL}
  LND_CERT_PATH: /run/secrets/lnd-tls-cert
  LND_MACAROON_PATH: /run/secrets/lnd-invoice-macaroon
  LND_INVOICE_EXPIRY_SECONDS: ${LND_INVOICE_EXPIRY_SECONDS:-600}
  LND_REQUEST_TIMEOUT_SECONDS: ${LND_REQUEST_TIMEOUT_SECONDS:-10}
  IP_ENABLED: ${IP_ENABLED:-true}
  IP_SALES_PAUSED: ${IP_SALES_PAUSED:-false}
  IP_YEARLY_SATS: ${IP_YEARLY_SATS}
  BILLING_YEARLY_ENABLED: ${BILLING_YEARLY_ENABLED:-false}
  WIREGUARD_SMTP_EGRESS_FEE_SATS: ${WIREGUARD_SMTP_EGRESS_FEE_SATS:-50000}
  PORT_ENABLED: ${PORT_ENABLED:-true}
  PORT_SALES_PAUSED: ${PORT_SALES_PAUSED:-false}
  PORT_MONTHLY_SATS: ${PORT_MONTHLY_SATS}
  PORT_YEARLY_SATS: ${PORT_YEARLY_SATS}
  RELAY_ENABLED: ${RELAY_ENABLED:-true}
  RELAY_SALES_PAUSED: ${RELAY_SALES_PAUSED:-false}
  RELAY_MONTHLY_SATS: ${RELAY_MONTHLY_SATS}
  RELAY_YEARLY_SATS: ${RELAY_YEARLY_SATS}
  RELAY_WILDCARD_MONTHLY_SATS: ${RELAY_WILDCARD_MONTHLY_SATS}
  RELAY_WILDCARD_YEARLY_SATS: ${RELAY_WILDCARD_YEARLY_SATS}
  RELAY_MANAGED_DOMAIN_CAP: ${RELAY_MANAGED_DOMAIN_CAP:-25}
  RELAY_CUSTOMER_DOMAINS_ENABLED: ${RELAY_CUSTOMER_DOMAINS_ENABLED:-true}
  ACCOUNT_MAX_NON_CANCELLED_SUBSCRIPTIONS: ${ACCOUNT_MAX_NON_CANCELLED_SUBSCRIPTIONS:-20}
  ACCOUNT_MAX_OPEN_PAYMENTS: ${ACCOUNT_MAX_OPEN_PAYMENTS:-5}
  ACCOUNT_MAX_PENDING_RELAY_CLAIMS: ${ACCOUNT_MAX_PENDING_RELAY_CLAIMS:-2}
  IP_REUSE_QUARANTINE_SECONDS: ${IP_REUSE_QUARANTINE_SECONDS:-604800}
  RESOURCE_REUSE_QUARANTINE_SECONDS: ${RESOURCE_REUSE_QUARANTINE_SECONDS:-180}
  RATE_LIMIT_SIGNUP_REQUESTS: ${RATE_LIMIT_SIGNUP_REQUESTS:-10}
  RATE_LIMIT_SIGNUP_WINDOW_SECONDS: ${RATE_LIMIT_SIGNUP_WINDOW_SECONDS:-60}
  RATE_LIMIT_ADMIN_LOGIN_REQUESTS: ${RATE_LIMIT_ADMIN_LOGIN_REQUESTS:-5}
  RATE_LIMIT_ADMIN_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_ADMIN_LOGIN_WINDOW_SECONDS:-300}
  ADMIN_SESSION_MAX_AGE_SECONDS: ${ADMIN_SESSION_MAX_AGE_SECONDS:-900}
  RATE_LIMIT_BROWSER_LOGIN_REQUESTS: ${RATE_LIMIT_BROWSER_LOGIN_REQUESTS:-10}
  RATE_LIMIT_BROWSER_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_BROWSER_LOGIN_WINDOW_SECONDS:-300}
  RELAY_PUBLIC_IPS: ${RELAY_FRAMED_IPS:-}
  WIREGUARD_PUBLIC_IPS: ""
  WIREGUARD_RELAY_PUBLIC_KEY: ""
  WIREGUARD_ENDPOINT: ""
  RELAY_SHARED_IPS: ${RELAY_PUBLIC_IP}
  RELAY_SHARED_TCP_PORTS: ${PORT_TCP_RANGE}
  RELAY_SHARED_UDP_PORTS: ${PORT_UDP_RANGE}
  PORT_TCP_CAPACITY: ${PORT_TCP_CAPACITY:-4096}
  PORT_UDP_CAPACITY: ${PORT_UDP_CAPACITY:-4096}
  RELAY_POOL_DOMAINS: ${RELAY_POOL_DOMAINS}
  RELAY_CONTROL_URL: ${RELAY_CONTROL_HOST}:5443
  RELAY_CONTROL_URLS: ${RELAY_CONTROL_URLS}
  PORT_HA_EDGES: ${PORT_HA_EDGES:-}
  PORT_HOSTNAME_SUFFIX: ${PORT_HOSTNAME_SUFFIX:-}
  FRAMED_IP_ENDPOINTS: ${FRAMED_IP_ENDPOINTS:-}
  RELAY_EDGES: ${RELAY_EDGES:-}
  RELAY_HEARTBEAT_STALE_SECONDS: ${RELAY_HEARTBEAT_STALE_SECONDS:-90}
  BANDWIDTH_METRICS_ENABLED: ${BANDWIDTH_METRICS_ENABLED:-false}
  BANDWIDTH_RETENTION_DAYS: ${BANDWIDTH_RETENTION_DAYS:-400}
  BANDWIDTH_INGEST_MAX_AGE_DAYS: ${BANDWIDTH_INGEST_MAX_AGE_DAYS:-3}
  BANDWIDTH_CLEANUP_INTERVAL_SECONDS: ${BANDWIDTH_CLEANUP_INTERVAL_SECONDS:-3600}
  BANDWIDTH_CLEANUP_BATCH_SIZE: ${BANDWIDTH_CLEANUP_BATCH_SIZE:-1000}
  DNS_SUPERVISION_ENABLED: ${DNS_SUPERVISION_ENABLED:-false}
  DNS_SUPERVISION_INTERVAL_SECONDS: ${DNS_SUPERVISION_INTERVAL_SECONDS:-60}
  DNS_SUPERVISION_STALE_SECONDS: ${DNS_SUPERVISION_STALE_SECONDS:-180}
  DNS_SUPERVISION_TARGETS: ${DNS_SUPERVISION_TARGETS:-}
  DNS_SUPERVISION_RESOLVERS: ${DNS_SUPERVISION_RESOLVERS:-1.1.1.1,8.8.8.8}
  RELAY_MANAGED_SUFFIXES: ${RELAY_MANAGED_SUFFIXES}
  RELAY_MANAGED_DOMAIN_CLAIM_TTL_SECONDS: ${RELAY_MANAGED_DOMAIN_CLAIM_TTL_SECONDS:-1800}
  RELAY_DOMAIN_CLAIM_TTL_SECONDS: ${RELAY_DOMAIN_CLAIM_TTL_SECONDS:-3600}
  RELAY_RENEWAL_GRACE_SECONDS: ${RELAY_RENEWAL_GRACE_SECONDS:-604800}
  BRAND_NAME: ${BRAND_NAME:-Blindport}
  BRAND_TAGLINE: ${BRAND_TAGLINE:-Public reach for self-hosted services. TLS stays on your box.}
  PUBLIC_SITE_URL: https://${API_DOMAIN}
  PASSKEYS_ENABLED: ${PASSKEYS_ENABLED:-false}
  WEBAUTHN_RP_ID: ${API_DOMAIN}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Blindport}
  WEBAUTHN_ORIGIN: https://${API_DOMAIN}
  BROWSER_SESSION_MAX_AGE_SECONDS: ${BROWSER_SESSION_MAX_AGE_SECONDS:-2592000}
  BROWSER_SESSION_MAX_PER_USER: ${BROWSER_SESSION_MAX_PER_USER:-20}

