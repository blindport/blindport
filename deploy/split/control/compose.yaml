services:
  postgres:
    <<: *service-defaults
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: blindport
      POSTGRES_USER: blindport
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blindport -d blindport"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 200
    mem_limit: 1g
    cpus: 2.0
    shm_size: 256m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  migrate:
    <<: *service-defaults
    image: ${BACKEND_IMAGE}
    profiles: [tools]
    restart: "no"
    environment:
      <<: *backend-environment
      REMINDER_EMAIL_ENABLED: "false"
      SMTP_USERNAME: ""
      SMTP_PASSWORD_FILE: ""
      OFFLINE_ENTITLEMENTS_ENABLED: "false"
      OFFLINE_ENTITLEMENT_PRIVATE_KEY_FILE: ""
    secrets: *backend-secrets
    volumes:
      - backend-ca:/var/lib/blindport/ca
    networks:
      - application
      - database
    depends_on:
      postgres:
        condition: service_healthy
    command: ["blindport-migrate", "upgrade"]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  backend:
    <<: *service-defaults
    image: ${BACKEND_IMAGE}
    environment: *backend-environment
    secrets:
      - source: database-url
        target: database-url
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: relay-secret
        target: relay-secret
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: relay-heartbeat-keys
        target: relay-heartbeat-keys
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: secret-key
        target: secret-key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: token-hash-key
        target: token-hash-key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: admin-token
        target: admin-token
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: lnd-invoice-hmac-key
        target: lnd-invoice-hmac-key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: lnd-tls-cert
        target: lnd-tls-cert
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: lnd-invoice-macaroon
        target: lnd-invoice-macaroon
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: smtp-password
        target: smtp-password
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: credential-encryption-key
        target: credential-encryption-key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: clink-nostr-private-key
        target: clink-nostr-private-key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: offline-entitlement-private-key
        target: offline-entitlement-private-key
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - backend-ca:/var/lib/blindport/ca
    networks:
      - application
      - database
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 200
    mem_limit: 768m
    cpus: 2.0
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=12)"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s

  caddy:
    <<: *service-defaults
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    user: "1000:1000"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      RELAY_PRIVATE_CIDRS: ${RELAY_PRIVATE_CIDRS}
      ADMIN_PRIVATE_CIDRS: ${ADMIN_PRIVATE_CIDRS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${STATE_DIR:-./state}/caddy-data:/data
      - ${STATE_DIR:-./state}/caddy-config:/config
    networks:
      - application
    ports:
      - "${CONTROL_BIND_IP:-0.0.0.0}:80:8080/tcp"
      - "${CONTROL_BIND_IP:-0.0.0.0}:443:8443/tcp"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  application:
  database:
    internal: true

volumes:
  postgres-data:
  backend-ca:

secrets:
  database-url:
    file: ${SECRETS_DIR:-./secrets}/database-url
  postgres-password:
    file: ${SECRETS_DIR:-./secrets}/postgres-password
  relay-secret:
    file: ${SECRETS_DIR:-./secrets}/relay-secret
  relay-heartbeat-keys:
    file: ${SECRETS_DIR:-./secrets}/relay-heartbeat-keys
  secret-key:
    file: ${SECRETS_DIR:-./secrets}/secret-key
  token-hash-key:
    file: ${SECRETS_DIR:-./secrets}/token-hash-key
  admin-token:
    file: ${SECRETS_DIR:-./secrets}/admin-token
  lnd-invoice-hmac-key:
    file: ${SECRETS_DIR:-./secrets}/lnd-invoice-hmac-key
  lnd-tls-cert:
    file: ${SECRETS_DIR:-./secrets}/lnd-tls-cert
  lnd-invoice-macaroon:
    file: ${SECRETS_DIR:-./secrets}/lnd-invoice-macaroon
  smtp-password:
    file: ${SECRETS_DIR:-./secrets}/smtp-password
  credential-encryption-key:
    file: ${SECRETS_DIR:-./secrets}/credential-encryption-key
  clink-nostr-private-key:
    file: ${CLINK_NOSTR_PRIVATE_KEY_SOURCE:-/dev/null}
  offline-entitlement-private-key:
    file: ${SECRETS_DIR:-./secrets}/offline-entitlement-private-key
