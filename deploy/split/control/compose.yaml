  - source: database-url
    target: database-url
    uid: "10001"
    gid: "10001"
    mode: 0400
  - source: relay-secret
    target: relay-secret
    uid: "10001"
    gid: "10001"
    mode: 0400
  - source: relay-heartbeat-keys
    target: relay-heartbeat-keys
    uid: "10001"
    gid: "10001"
    mode: 0400
  - source: secret-key
    target: secret-key
    uid: "10001"
    gid: "10001"
    mode: 0400
  - source: token-hash-key
    target: token-hash-key
    uid: "10001"
    gid: "10001"
    mode: 0400
  - source: admin-token
    target: admin-token
    uid: "10001"
    gid: "10001"
    mode: 0400
  - source: lnd-invoice-hmac-key
    target: lnd-invoice-hmac-key
    uid: "10001"
    gid: "10001"
    mode: 0400
  - source: lnd-tls-cert
    target: lnd-tls-cert
    uid: "10001"
    gid: "10001"
    mode: 0400
  - source: lnd-invoice-macaroon
    target: lnd-invoice-macaroon
    uid: "10001"
    gid: "10001"
    mode: 0400
  - source: credential-encryption-key
    target: credential-encryption-key
    uid: "10001"
