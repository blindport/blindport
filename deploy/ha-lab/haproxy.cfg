global
    maxconn 512

defaults
    mode http
    timeout connect 3s
    timeout client 15s
    timeout server 15s

frontend api
    bind :8000
    default_backend api_replicas

backend api_replicas
    balance roundrobin
    option httpchk GET /api/v1/health/ready
    http-check expect status 200
    default-server check inter 1s fall 2 rise 2 init-addr libc,none
    server backend-a backend-a:8000
    server backend-b backend-b:8000
