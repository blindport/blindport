global
    maxconn 4096

defaults
    timeout connect 5s
    timeout client 2m
    timeout server 2m
    timeout tunnel 1h

frontend public_tls
    mode tcp
    bind "${PUBLIC_IP}:443"
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl api_sni req.ssl_sni -i "${API_DOMAIN}"
    use_backend api_tls if api_sni
    default_backend relay_tls

backend api_tls
    mode tcp
    server caddy 127.0.0.1:8443 send-proxy-v2 check

backend relay_tls
    mode tcp
    option httpchk GET /readyz
    http-check expect status 200
    server relay 127.0.0.1:4443 send-proxy-v2 check port 9090

frontend public_http
    mode http
    bind "${PUBLIC_IP}:80"
    acl api_host hdr(host),field(1,:) -i "${API_DOMAIN}"
    use_backend api_http if api_host
    default_backend relay_http

backend api_http
    mode http
    server caddy 127.0.0.1:8080 check

backend relay_http
    mode http
    server relay 127.0.0.1:4080

frontend relay_health_ingress
    mode http
    bind "${PUBLIC_IP}:9080"
    http-request deny unless { method GET } { path /readyz }
    default_backend relay_health_backend

backend relay_health_backend
    mode http
    option httpchk GET /readyz
    http-check expect status 200
    server relay 127.0.0.1:9090 check
